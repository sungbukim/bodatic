<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bodatic</title>
<meta name="description" content="나의 하루를 보고, 체크하다">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: single column planner — brand bar, week strip, day sheet; add bar fixed to the bottom */
:root{
  --paper:#f5f6f8; --sheet:#ffffff; --ink:#1d2433; --muted:#6b7385; --line:#e2e5ec;
  --accent:#3046c9; --accent-soft:#e6e9fb; --mark:#fff1a8; --danger:#c2413a; --warn:#a15c00; --ok:#2f7d4f;
  --display:"Gaegu","Gowun Dodum",cursive,sans-serif;
  --body:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12151c; --sheet:#1a1e27; --ink:#e7e9ef; --muted:#959cad; --line:#2a303c;
  --accent:#8b9cff; --accent-soft:#252b48; --mark:#4a4520; --danger:#ff8a80; --warn:#f0b35a; --ok:#6fcf97; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12151c; --sheet:#1a1e27; --ink:#e7e9ef; --muted:#959cad; --line:#2a303c;
  --accent:#8b9cff; --accent-soft:#252b48; --mark:#4a4520; --danger:#ff8a80; --warn:#f0b35a; --ok:#6fcf97; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(14px + env(safe-area-inset-top,0px)) 150px}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* brand bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.01em}
.brand .mk{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.top-right{display:flex;align-items:center;gap:8px;min-width:0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.sync.pending i{background:var(--accent)}
.sync.offline{color:var(--warn)} .sync.offline i{background:var(--warn)}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-weight:600;font-size:14px;flex:none}

/* day header */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:36px;font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.pill{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}

/* week strip */
.week{display:flex;align-items:center;gap:6px}
.week .nav{border:0;background:none;color:var(--muted);font-size:20px;width:28px;height:44px;cursor:pointer;flex:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1;min-width:0}
.day{border:0;background:none;border-radius:12px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .dw{font-size:11px;color:var(--muted);letter-spacing:.02em}
.day .dn{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.day.sun .dw{color:var(--danger)} .day.sat .dw{color:var(--accent)}
.day.is-today .dn{background:var(--mark);border-radius:6px;padding:0 6px}
.day.sel{background:var(--accent);color:#fff}
.day.sel .dw{color:#fff;opacity:.85}
.day.sel.is-today .dn{background:transparent}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:0}
.day.has .dot{opacity:1} .day.sel .dot{background:#fff}

/* sheets */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--display);font-size:23px;font-weight:700;margin:0}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:grid;grid-template-columns:auto 52px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);background:none;cursor:pointer;display:grid;place-items:center;color:#fff;padding:0}
li.done .chk{background:var(--accent);border-color:var(--accent)}
.time{font-size:13px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.time.none{color:var(--muted);font-weight:400}
.txt{min-width:0;overflow-wrap:anywhere;font-family:var(--display);font-size:18px;line-height:1.3}
li.done .txt{text-decoration:line-through;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;width:32px;height:32px;border-radius:8px}
.del:hover{color:var(--danger);background:var(--paper)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px;margin:0}
.later h3{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 6px;letter-spacing:.02em}
.later .row{display:flex;gap:10px;padding:6px 0;cursor:pointer;border:0;background:none;text-align:left;width:100%;font-size:14px}
.later .d{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:72px}
.later .t{min-width:0;overflow-wrap:anywhere}
.later .t b{font-family:var(--display);font-size:17px;font-weight:400}

/* add bar */
.add{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.add form{max-width:560px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px}
input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
#f-title{flex:1 1 100%}
#f-date{flex:1 1 140px} #f-time{flex:1 1 100px}
.solid{flex:0 0 auto;font-weight:600;border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:#fff;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* login */
.login{min-height:calc(100vh - 200px);display:grid;place-items:center}
.login-card{width:100%;max-width:380px;background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:28px 22px;display:flex;flex-direction:column;gap:16px}
.login-card .mk{width:52px;height:52px;border-radius:16px;background:var(--accent);display:grid;place-items:center;color:#fff}
.login-card h1{font-size:42px}
.login-card form{display:flex;flex-direction:column;gap:8px}
.login-card label{font-size:13px;color:var(--muted);margin-top:4px}
.login-card .solid{margin-top:8px;padding:12px}
.err{color:var(--danger);font-size:13px;margin:0;min-height:1.2em}
.msg{color:var(--ok);font-size:13px;margin:0}
.link{border:0;background:none;color:var(--accent);cursor:pointer;font-size:14px;padding:4px 0;align-self:flex-start}

/* account sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:100%;max-width:420px;background:var(--sheet);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.panel .label{font-size:12px;color:var(--muted);margin:0;letter-spacing:.02em}
.panel .email{font-weight:600;margin:0;overflow-wrap:anywhere}
.btn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px}
.btn.danger{color:var(--danger)}
.stack{display:flex;flex-direction:column;gap:8px}
.confirm{background:var(--paper);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:14px}
.confirm .row{display:flex;gap:8px;justify-content:flex-end}
.ghost{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 16px;cursor:pointer}
.solid.red{background:var(--danger)}
.note{font-size:12px;color:var(--muted);margin:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);z-index:30}
.toast button{border:0;background:none;color:var(--mark);font-weight:600;cursor:pointer}
.boot{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="boot" id="boot">불러오는 중…</div>

<!-- 로그인 화면 -->
<main class="login" id="login" hidden>
  <div class="login-card">
    <div class="mk"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div>
      <h1>Bodatic</h1>
      <p class="sub">나의 하루를 보고, 체크하다</p>
    </div>
    <form id="lf" novalidate>
      <label for="l-email">이메일</label>
      <input id="l-email" type="email" autocomplete="username" inputmode="email" required>
      <label for="l-pw">비밀번호</label>
      <input id="l-pw" type="password" autocomplete="current-password" required>
      <p class="err" id="l-err" role="alert"></p>
      <button type="submit" class="solid" id="l-btn">로그인</button>
    </form>
    <button type="button" class="link" id="l-reset">비밀번호를 잊으셨나요?</button>
    <p class="msg" id="l-msg" hidden></p>
  </div>
</main>

<!-- 메인 화면 -->
<div class="wrap" id="main" hidden>
  <div class="top">
    <div class="brand"><span class="mk"><svg width="15" height="15" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Bodatic</div>
    <div class="top-right">
      <span class="sync" id="sync"><i></i><span id="sync-txt">동기화됨</span></span>
      <button type="button" class="avatar" id="btn-account" aria-label="계정">B</button>
    </div>
  </div>

  <div class="dayhead">
    <div>
      <h1 id="h-title">오늘</h1>
      <p class="sub" id="h-sub"></p>
    </div>
    <button class="pill" id="btn-today" type="button">오늘로</button>
  </div>

  <div class="week">
    <button class="nav" id="prev" type="button" aria-label="지난주">‹</button>
    <div class="days" id="days"></div>
    <button class="nav" id="next" type="button" aria-label="다음주">›</button>
  </div>

  <section class="sheet">
    <div class="sheet-head"><h2>할 일</h2><span class="count" id="count"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <ul id="list"></ul>
    <p class="empty" id="empty">이 날은 비어 있어요. 아래에서 할 일을 추가해 보세요.</p>
  </section>

  <section class="sheet later" id="later" hidden>
    <h3>다가오는 일정</h3>
    <div id="later-list"></div>
  </section>
</div>

<div class="add" id="addbar" hidden>
  <form id="f">
    <input id="f-title" placeholder="할 일 또는 일정을 입력하세요" autocomplete="off" required>
    <input id="f-date" type="date" aria-label="날짜">
    <input id="f-time" type="time" aria-label="시간 (선택)">
    <button type="submit" class="solid">추가</button>
  </form>
</div>

<!-- 계정 창 -->
<div class="scrim" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="acct-label">
    <div>
      <p class="label" id="acct-label">로그인된 계정</p>
      <p class="email" id="acct-email"></p>
    </div>
    <div class="stack" id="acct-actions">
      <button type="button" class="btn" id="btn-export">백업 파일 내려받기</button>
      <button type="button" class="btn" id="btn-import">백업 파일 불러오기</button>
      <input type="file" id="f-import" accept="application/json,.json" hidden>
      <p class="note" id="app-note" hidden>백업 내려받기와 불러오기는 PC에서 할 수 있어요.</p>
      <button type="button" class="btn danger" id="btn-logout">로그아웃</button>
    </div>
    <div class="confirm" id="logout-confirm" hidden>
      <p>로그아웃할까요? 할 일은 그대로 저장되어 있어서 다시 로그인하면 돌아와요.</p>
      <div class="row">
        <button type="button" class="ghost" id="lo-cancel">취소</button>
        <button type="button" class="solid red" id="lo-ok">로그아웃</button>
      </div>
    </div>
    <button type="button" class="ghost" id="sheet-close">닫기</button>
  </div>
</div>

<div class="toast" id="toast" hidden><span id="toast-msg"></span><button type="button" id="toast-undo" hidden>되돌리기</button></div>

<script type="module">
/*BACKEND-START*/
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, writeBatch, terminate, clearIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUTGQr0cjhg14bQesqgEVVbN8LkdumJyk",
  authDomain: "bodatic.firebaseapp.com",
  projectId: "bodatic",
  storageBucket: "bodatic.firebasestorage.app",
  messagingSenderId: "590982812075",
  appId: "1:590982812075:web:5ef7a61860b59a4245c2ee"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
auth.languageCode = "ko";
let db;
try {
  db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) {
  db = initializeFirestore(fbApp, {});
}
const itemsCol = uid => collection(db, "users", uid, "items");
const itemDoc = (uid, id) => doc(db, "users", uid, "items", id);

const backend = {
  onAuth: cb => onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email || "" } : null)),
  signIn: (email, pw) => signInWithEmailAndPassword(auth, email, pw),
  resetPassword: email => sendPasswordResetEmail(auth, email),
  async signOut() {
    await signOut(auth);
    try { await terminate(db); await clearIndexedDbPersistence(db); } catch (e) {}
    location.reload();
  },
  subscribe(uid, onItems, onPending, onError) {
    return onSnapshot(itemsCol(uid), { includeMetadataChanges: true }, snap => {
      onItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      onPending(snap.metadata.hasPendingWrites);
    }, onError);
  },
  newId: uid => doc(itemsCol(uid)).id,
  set: (uid, id, body) => setDoc(itemDoc(uid, id), body),
  update: (uid, id, patch) => updateDoc(itemDoc(uid, id), patch),
  remove: (uid, id) => deleteDoc(itemDoc(uid, id)),
  async setMany(uid, list) {
    for (let i = 0; i < list.length; i += 400) {
      const b = writeBatch(db);
      list.slice(i, i + 400).forEach(({ id, ...body }) => b.set(itemDoc(uid, id), body));
      await b.commit();
    }
  }
};
/*BACKEND-END*/

const WD = ["일", "월", "화", "수", "목", "금", "토"];
const pad = n => String(n).padStart(2, "0");
const key = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const todayKey = () => key(new Date());
const $ = id => document.getElementById(id);
const isApp = navigator.userAgent.includes("BodaticApp");

let user = null, items = [], unsub = null, sel = todayKey(), pending = false;

function show(screen) {
  $("boot").hidden = screen !== "boot";
  $("login").hidden = screen !== "login";
  $("main").hidden = screen !== "main";
  $("addbar").hidden = screen !== "main";
}

/* ---------- 로그인 ---------- */
const authMsg = {
  "auth/invalid-credential": "이메일 또는 비밀번호가 맞지 않아요.",
  "auth/wrong-password": "이메일 또는 비밀번호가 맞지 않아요.",
  "auth/user-not-found": "이메일 또는 비밀번호가 맞지 않아요.",
  "auth/invalid-email": "이메일 형식을 확인해 주세요.",
  "auth/too-many-requests": "시도가 너무 많아요. 잠시 후 다시 해주세요.",
  "auth/network-request-failed": "인터넷 연결을 확인해 주세요.",
  "auth/user-disabled": "사용이 중지된 계정이에요."
};
$("lf").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("l-email").value.trim(), pw = $("l-pw").value;
  $("l-err").textContent = ""; $("l-msg").hidden = true;
  if (!email || !pw) { $("l-err").textContent = "이메일과 비밀번호를 입력해 주세요."; return; }
  $("l-btn").disabled = true; $("l-btn").textContent = "로그인 중…";
  try { await backend.signIn(email, pw); $("l-pw").value = ""; }
  catch (err) { $("l-err").textContent = authMsg[err && err.code] || "로그인하지 못했어요. 다시 시도해 주세요."; }
  finally { $("l-btn").disabled = false; $("l-btn").textContent = "로그인"; }
});
$("l-reset").addEventListener("click", async () => {
  const email = $("l-email").value.trim();
  $("l-err").textContent = ""; $("l-msg").hidden = true;
  if (!email) { $("l-err").textContent = "위에 이메일을 먼저 입력한 뒤 눌러 주세요."; $("l-email").focus(); return; }
  try {
    await backend.resetPassword(email);
    $("l-msg").textContent = email + "(으)로 비밀번호 재설정 메일을 보냈어요. 메일함(스팸함 포함)을 확인해 주세요.";
    $("l-msg").hidden = false;
  } catch (err) { $("l-err").textContent = authMsg[err && err.code] || "메일을 보내지 못했어요. 이메일을 확인해 주세요."; }
});

backend.onAuth(u => {
  if (unsub) { unsub(); unsub = null; }
  user = u; items = [];
  if (!u) { show("login"); return; }
  $("btn-account").textContent = (u.email || "B").charAt(0).toUpperCase();
  $("acct-email").textContent = u.email;
  show("main"); render(); syncStatus();
  unsub = backend.subscribe(u.uid,
    list => { items = list; render(); },
    p => { pending = p; syncStatus(); },
    () => toast("할 일을 불러오지 못했어요. 새로고침해 주세요."));
});

/* ---------- 동기화 상태 ---------- */
function syncStatus() {
  const el = $("sync"), t = $("sync-txt");
  el.className = "sync";
  if (!navigator.onLine) { el.classList.add("offline"); t.textContent = "오프라인 · 연결되면 저장돼요"; }
  else if (pending) { el.classList.add("pending"); t.textContent = "저장 중…"; }
  else t.textContent = "동기화됨";
}
addEventListener("online", syncStatus);
addEventListener("offline", syncStatus);

/* ---------- 화면 그리기 ---------- */
function weekStart(k) { const d = parse(k); d.setDate(d.getDate() - d.getDay()); return d; }
const byTime = (a, b) => (a.time || "99") > (b.time || "99") ? 1 : (a.time || "99") < (b.time || "99") ? -1 : 0;
function go(k) { sel = k; $("f-date").value = k; render(); }

function render() {
  const tk = todayKey(), sd = parse(sel);
  $("h-title").textContent = sel === tk ? "오늘" : (sd.getMonth() + 1) + "월 " + sd.getDate() + "일";
  $("h-sub").textContent = sd.getFullYear() + "년 " + (sd.getMonth() + 1) + "월 " + sd.getDate() + "일 " + WD[sd.getDay()] + "요일";
  $("btn-today").hidden = sel === tk;

  const ws = weekStart(sel), has = new Set(items.filter(i => !i.done).map(i => i.date));
  const days = $("days"); days.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws); d.setDate(ws.getDate() + i); const k = key(d);
    const b = document.createElement("button"); b.type = "button";
    b.className = "day" + (i === 0 ? " sun" : "") + (i === 6 ? " sat" : "") + (k === tk ? " is-today" : "") + (k === sel ? " sel" : "") + (has.has(k) ? " has" : "");
    b.innerHTML = '<span class="dw">' + WD[i] + '</span><span class="dn">' + d.getDate() + '</span><span class="dot"></span>';
    b.setAttribute("aria-label", (d.getMonth() + 1) + "월 " + d.getDate() + "일");
    b.onclick = () => go(k);
    days.appendChild(b);
  }

  const list = items.filter(i => i.date === sel).sort((a, b) => (a.done - b.done) || byTime(a, b) || ((a.createdAt || 0) - (b.createdAt || 0)));
  const ul = $("list"); ul.innerHTML = "";
  list.forEach(it => {
    const li = document.createElement("li"); if (it.done) li.className = "done";
    const c = document.createElement("button"); c.type = "button"; c.className = "chk";
    c.setAttribute("aria-label", it.done ? "완료 취소" : "완료");
    c.innerHTML = it.done ? '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : "";
    c.onclick = () => write(backend.update(user.uid, it.id, { done: !it.done }));
    const t = document.createElement("span"); t.className = "time" + (it.time ? "" : " none"); t.textContent = it.time || "종일";
    const x = document.createElement("span"); x.className = "txt"; x.textContent = it.title;
    const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.setAttribute("aria-label", "삭제"); del.textContent = "×";
    del.onclick = () => removeItem(it);
    li.append(c, t, x, del); ul.appendChild(li);
  });
  const done = list.filter(i => i.done).length;
  $("count").textContent = list.length ? done + " / " + list.length + " 완료" : "";
  $("bar").style.width = list.length ? (done / list.length * 100) + "%" : "0";
  $("empty").hidden = !!list.length;

  const up = items.filter(i => !i.done && i.date > tk && i.date !== sel)
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : byTime(a, b)).slice(0, 5);
  $("later").hidden = !up.length;
  const ll = $("later-list"); ll.innerHTML = "";
  up.forEach(it => {
    const d = parse(it.date); const r = document.createElement("button"); r.type = "button"; r.className = "row";
    r.innerHTML = '<span class="d"></span><span class="t"></span>';
    r.querySelector(".d").textContent = (d.getMonth() + 1) + "/" + d.getDate() + " (" + WD[d.getDay()] + ")";
    const tt = r.querySelector(".t"); tt.textContent = it.time ? it.time + " " : ""; const tb = document.createElement("b"); tb.textContent = it.title; tt.appendChild(tb);
    r.onclick = () => go(it.date); ll.appendChild(r);
  });
}

/* ---------- 쓰기 ---------- */
// 오프라인일 때도 화면에는 바로 반영되고, 연결되면 저장돼요. 실패만 알려줘요.
function write(promise) {
  Promise.resolve(promise).catch(err => {
    toast(err && err.code === "resource-exhausted" ? "저장 한도에 도달했어요. 잠시 후 다시 시도해 주세요." : "저장하지 못했어요. 다시 시도해 주세요.");
  });
}

$("f").addEventListener("submit", e => {
  e.preventDefault();
  const title = $("f-title").value.trim(); if (!title || !user) return;
  const body = { title, date: $("f-date").value || sel, time: $("f-time").value || "", done: false, createdAt: Date.now() };
  $("f-title").value = ""; $("f-time").value = "";
  sel = body.date;
  write(backend.set(user.uid, backend.newId(user.uid), body));
  render();
  $("f-title").focus();
});

let lastDeleted = null, toastTimer = null;
function toast(msg, undo) {
  $("toast-msg").textContent = msg;
  $("toast-undo").hidden = !undo;
  $("toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; }, 5000);
}
function removeItem(it) {
  lastDeleted = { ...it };
  write(backend.remove(user.uid, it.id));
  toast("‘" + it.title + "’ 삭제됨", true);
}
$("toast-undo").onclick = () => {
  $("toast").hidden = true; if (!lastDeleted || !user) return;
  const { id, ...body } = lastDeleted; lastDeleted = null;
  write(backend.set(user.uid, id, body));
};

$("prev").onclick = () => { const d = parse(sel); d.setDate(d.getDate() - 7); go(key(d)); };
$("next").onclick = () => { const d = parse(sel); d.setDate(d.getDate() + 7); go(key(d)); };
$("btn-today").onclick = () => go(todayKey());
document.addEventListener("visibilitychange", () => { if (!document.hidden && user) render(); });

/* ---------- 계정 창 ---------- */
function openSheet() {
  $("logout-confirm").hidden = true; $("acct-actions").hidden = false;
  $("btn-export").hidden = isApp; $("btn-import").hidden = isApp; $("app-note").hidden = !isApp;
  $("sheet").hidden = false; $("sheet-close").focus();
}
function closeSheet() { $("sheet").hidden = true; $("btn-account").focus(); }
$("btn-account").onclick = openSheet;
$("sheet-close").onclick = closeSheet;
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

$("btn-logout").onclick = () => { $("acct-actions").hidden = true; $("logout-confirm").hidden = false; $("lo-ok").focus(); };
$("lo-cancel").onclick = () => { $("logout-confirm").hidden = true; $("acct-actions").hidden = false; };
$("lo-ok").onclick = async () => { $("lo-ok").disabled = true; $("lo-ok").textContent = "로그아웃 중…"; await backend.signOut(); };

$("btn-export").onclick = () => {
  const data = { app: "bodatic", version: 1, exportedAt: new Date().toISOString(), items };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "bodatic-backup-" + todayKey() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("백업 파일을 내려받았어요 (" + items.length + "개)");
};
$("btn-import").onclick = () => $("f-import").click();
$("f-import").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file || !user) return;
  try {
    const data = JSON.parse(await file.text());
    const ok = /^\d{4}-\d{2}-\d{2}$/;
    const list = (Array.isArray(data.items) ? data.items : []).filter(i => i && typeof i.title === "string" && ok.test(i.date))
      .map(i => ({ id: typeof i.id === "string" && /^[A-Za-z0-9_-]{1,100}$/.test(i.id) ? i.id : backend.newId(user.uid),
        title: i.title.slice(0, 500), date: i.date, time: /^\d{2}:\d{2}$/.test(i.time || "") ? i.time : "", done: !!i.done, createdAt: Number(i.createdAt) || Date.now() }));
    if (!list.length) { toast("이 파일에서 불러올 할 일을 찾지 못했어요."); return; }
    await backend.setMany(user.uid, list);
    closeSheet();
    toast(list.length + "개의 할 일을 불러왔어요.");
  } catch (err) { toast("Bodatic 백업 파일이 맞는지 확인해 주세요."); }
};

$("f-date").value = sel;

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
